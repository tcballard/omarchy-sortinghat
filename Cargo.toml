[workspace]
members = [
  "crates/sortinghat-agent",
  "crates/sortinghat-cli",
  "crates/sortinghat-core",
  "crates/sortinghat-fs",
  "crates/sortinghat-journal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tcballard/Omarchy-SortingHat"
rust-version = "1.85"

[workspace.dependencies]
base64 = "=0.23.1"
clap = { version = "=4.6.6", features = ["derive", "env"] }
globset = "=0.4.19"
hex = "=0.4.3"
rusqlite = { version = "=0.39.0", features = ["bundled", "modern_sqlite"] }
rustix = { version = "=1.1.4", features = ["fs", "linux_latest", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
uuid = { version = "=1.26.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
