name: verify

on:
  push:
    branches: [main, feat/machine-independent-v0.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  machine-independent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Install pinned dependency policy checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Verify
        env:
          CARGO: cargo
        run: ./scripts/verify.sh
      - name: Package exact-commit candidate
        if: github.event_name == 'push'
        run: ./scripts/package-committed.sh "$GITHUB_SHA"
      - name: Upload exact-commit candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sortinghat-${{ github.sha }}
          path: |
            dist/sortinghat-0.1.0-x86_64-unknown-linux-gnu.tar.gz
            dist/sortinghat-0.1.0-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
